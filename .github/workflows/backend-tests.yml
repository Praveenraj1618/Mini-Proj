name: ClauseIQ backend tests

on:
  push:
    branches:
      - feature/mentor-enhancements
  pull_request:
    branches:
      - main
      - feature/mentor-enhancements
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run legal intelligence tests
        run: python -m pytest backend/tests/test_legal_intelligence.py -q -p no:cacheprovider

      - name: Run backend regression tests
        run: python -m pytest backend/tests -q -p no:cacheprovider
