name: ClauseIQ UI checks

on:
  push:
    branches:
      - main
      - redesign/clauseiq-workspace
      - devb
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run backend test suite
        env:
          LEGAL_AI_OFFLINE: "true"
        run: python -m pytest backend/tests -q

      - name: Start API and smoke-test server routes
        env:
          LEGAL_AI_OFFLINE: "true"
          PORT: "8765"
        run: |
          python backend/app_api.py > /tmp/clauseiq-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/api/status -o /tmp/clauseiq-status.json; then
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('/tmp/clauseiq-status.json').read_text())
          assert status.get('status') == 'online', status
          print('API status route is online.')
          PY
          curl --silent --fail http://127.0.0.1:8765/ -o /tmp/clauseiq-home.html
          grep -q 'ClauseIQ' /tmp/clauseiq-home.html
          DEPENDENCIES_STATUS=$(curl --silent --output /tmp/clauseiq-dependencies.json --write-out '%{http_code}' http://127.0.0.1:8765/api/dependencies)
          test "$DEPENDENCIES_STATUS" = "400"
          grep -q 'No document is loaded' /tmp/clauseiq-dependencies.json
          echo "Frontend route and authenticated dependency endpoint guard passed."

  frontend-state-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run frontend state regression tests
        run: node --test frontend/tests/state.test.cjs
      - name: Check frontend HTML structure and JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('frontend/index.html', 'utf8');
          const ids = [
            'response-language', 'source-language', 'document-category',
            'dropzone-box', 'file-input', 'doc-stats', 'heatmap-container',
            'summary-container', 'qa-input', 'qa-output', 'clause-input',
            'negotiate-output', 'obligations-container', 'dependencies-container',
            'dependencies-summary', 'dependency-graph', 'dependencies-limits', 'visuals-container',
            'visual-analysis-output', 'compare-file-2', 'compare-container',
            'llm-status', 'check-ai-button'
          ];
          for (const id of ids) {
            if (!html.includes(`id="${id}"`)) throw new Error(`Missing required UI element: ${id}`);
          }
          for (const id of ['heatmap-tab','summary-tab','qa-tab','negotiate-tab','obligations-tab','dependencies-tab','visuals-tab','compare-tab']) {
            if (!html.includes(`id="${id}"`)) throw new Error(`Missing analysis panel: ${id}`);
          }
          if (!html.includes('ClauseIQ')) throw new Error('ClauseIQ branding is missing');
          if (!html.includes('function loadDependencies')) throw new Error('Clause relationship explorer is missing');
          if (!html.includes('/api/dependencies')) throw new Error('Clause dependency API client is missing');
          if (!html.includes('--gold:#d6ae58')) throw new Error('Gold theme token is missing');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('No inline application script found');
          for (const script of scripts) new vm.Script(script[1], { filename: 'frontend/index.html inline script' });
          console.log('UI structure and inline JavaScript syntax checks passed.');
          NODE